# Construeix la versió de navegador (pygbag) i la publica a GitHub Pages a cada push a main.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependències
        run: pip install pygame-ce pytest pygbag==0.9.3
      - name: Proves
        run: python -m pytest -q tests
      - name: Versió web
        run: python tools/fer_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build_web/el-ultimo-tren/build/web

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - id: desplegament
        uses: actions/deploy-pages@v4
